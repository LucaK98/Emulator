<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Emulator</title>

    <!-- viewport-fit=cover lets the app draw into the notch/home-indicator area;
         the CSS then pads content back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0e1116" />
    <meta name="color-scheme" content="dark" />

    <!-- Standalone launch from the iOS home screen. This is what exempts the
         app from Safari's 7-day storage eviction. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Emulator" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
